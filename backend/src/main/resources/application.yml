server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: office-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/office_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # схемой управляет только Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  timezone: ${APP_TIMEZONE:Asia/Bishkek}
  # Начальные значения. После первого запуска настройки живут в БД и меняются руководителем.
  office-capacity: ${APP_OFFICE_CAPACITY:10}
  allow-same-day-booking: ${APP_ALLOW_SAME_DAY_BOOKING:false}
  cancellation-deadline-hours: ${APP_CANCELLATION_DEADLINE_HOURS:0}
  jwt:
    secret: ${JWT_SECRET}         # обязателен, минимум 32 байта
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    manager-email: ${BOOTSTRAP_MANAGER_EMAIL:}
    manager-password: ${BOOTSTRAP_MANAGER_PASSWORD:}
    manager-first-name: ${BOOTSTRAP_MANAGER_FIRST_NAME:Manager}
    manager-last-name: ${BOOTSTRAP_MANAGER_LAST_NAME:Admin}
    demo-data: ${APP_DEMO_DATA:false}
    demo-password: ${APP_DEMO_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
