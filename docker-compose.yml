# Локальная PostgreSQL для разработки.
# Запуск: docker compose up -d   (переменные берутся из .env в корне проекта)
services:
  db:
    image: postgres:16-alpine
    container_name: office-booking-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-office_booking}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в файле .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - office-booking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-office_booking}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  office-booking-pgdata:
